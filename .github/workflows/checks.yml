name: checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main", "scenario/ci-*"]

permissions:
  contents: read

jobs:
  orders-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: pip install pytest==8.4.2 ruff==0.15.12
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
